<!DOCTYPE html>
<!-- Fleet Website - main dashboard (same screens as the old Fleet_Dashboard.html).
     Scripts at the bottom: supabase library, config.js, data.js (database),
     views.js (drawing + due-date math), app.js (sign-in check + editing). -->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />
  <title>Fleet Manager — Dashboard</title>
  <link rel="icon" type="image/png" href="fleet_icon.png" />
  <link rel="apple-touch-icon" href="fleet_icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/website.css" />
</head>
<body>
  <!-- covers the page until data is loaded -->
  <div id="loadingScreen" class="loading-screen">Loading fleet data…</div>
  <!-- TOP COMMAND BAR -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo" style="background:none;padding:0;overflow:hidden;"><img src="fleet_icon.png" alt="FM" style="width:40px;height:40px;border-radius:10px;display:block;" /></div>
        <div class="brand-title">
          <h1>Fleet Manager — 3-Car Command Center</h1>
          <p id="syncStatusText">Loading fleet data…</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-primary" onclick="openLogModal()">+ Log Service</button>
        <button class="btn" onclick="reloadFromCloud()" title="Get the latest data (for example after a bot updated it)">↻ Refresh</button>
        <button class="btn" onclick="exportDatabaseJSON()" title="Download a backup copy (fleet_database.json)">💾 Backup JSON</button>
        <button class="btn" onclick="exportServiceLogCSV()">📊 Export CSV</button>
        <button class="btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
        <button class="btn" onclick="signOut()" title="Sign out" id="signOutBtn">⎋ Sign out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- VEHICLE SELECTOR TABS -->
    <div class="vehicle-tabs" id="vehicleTabs"></div>

    <!-- SUB-NAVIGATION -->
    <div class="subnav" id="subNav">
      <button class="sub-btn active" data-sec="dashboard" onclick="setSection('dashboard')">🚀 Live Dashboard & Next Up</button>
      <button class="sub-btn" data-sec="tires" onclick="setSection('tires')">🛞 Tire Rotation Ladder & Specs</button>
      <button class="sub-btn" data-sec="servicelog" onclick="setSection('servicelog')">📋 Service Log (<span id="logCountBadge">0</span>)</button>
      <button class="sub-btn" data-sec="checklists" onclick="setSection('checklists')">✅ Official VW & Tesla Checklists</button>
      <button class="sub-btn" data-sec="insurance" onclick="setSection('insurance')">🛡️ NY DMV, Insurance & Cloud Links</button>
      <button class="sub-btn" data-sec="manage" onclick="setSection('manage')">🛠 Manage Data</button>
    </div>

    <!-- DYNAMIC VIEW CONTAINER -->
    <div id="viewRoot"></div>
  </main>

  <!-- MOBILE BOTTOM BAR FOR S25 ULTRA -->
  <nav class="mobile-nav" id="mobileNav"><!-- buttons are added by app.js, one per vehicle --></nav>

  <!-- LOG SERVICE MODAL -->
  <div id="logModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:300; align-items:center; justify-content:center; padding:16px;">
    <div class="card" style="max-width:640px; width:100%; margin:0; max-height:90vh; overflow-y:auto;">
      <div class="card-hdr">
        <div class="card-title">➕ Log Completed Service Record</div>
        <button class="btn" onclick="closeLogModal()">✕ Close</button>
      </div>
      <form onsubmit="submitNewLog(event)">
        <div class="form-grid">
          <div class="form-field">
            <label>Date Performed</label>
            <input type="date" id="logDate" required />
          </div>
          <div class="form-field">
            <label>Vehicle</label>
            <select id="logVehicle" onchange="populateServiceItemDropdown()" required><!-- filled by app.js --></select>
          </div>
          <div class="form-field">
            <label>Odometer (Miles)</label>
            <input type="number" id="logOdo" required placeholder="e.g. 140000" />
          </div>
          <div class="form-field">
            <label>Service Item / Package</label>
            <select id="logItem" required></select>
          </div>
          <div class="form-field">
            <label>Cost ($)</label>
            <input type="number" step="0.01" id="logCost" placeholder="0.00" />
          </div>
          <div class="form-field">
            <label>Done By</label>
            <select id="logDoneBy">
              <option value="Independent shop">Independent shop</option>
              <option value="Dealer">Dealer</option>
              <option value="DIY">DIY</option>
            </select>
          </div>
          <div class="form-field">
            <label>Shop / Vendor</label>
            <input type="text" id="logShop" placeholder="e.g. BJ's Tire Center / Carquest" />
          </div>
          <div class="form-field">
            <label>Invoice / RO #</label>
            <input type="text" id="logInv" placeholder="e.g. Inv #142-2129772" />
          </div>
        </div>
        <div class="form-field" style="margin-bottom:12px;">
          <label>Details (Parts, Oil Spec, Tire Brand/DOT, Notes)</label>
          <input type="text" id="logDetails" placeholder="e.g. Mobil 1 FS 5W-40 5 Qts + Tire rotation @ 30 PSI" />
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn" onclick="closeLogModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save to Service Log & Recalculate</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
